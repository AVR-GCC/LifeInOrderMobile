name: Build and submit Android

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Submit to Google Play
    needs: [build_android]
    env:
      EXPO_DEBUG: "1"
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}
